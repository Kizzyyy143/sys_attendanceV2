{% extends "base.html" %}

{% block title %}
Add Student
{% endblock %}

{% block page_title %}
Add Student
{% endblock %}


{% block content %}

<div class="max-w-3xl mx-auto">

<div class="bg-white rounded-2xl shadow p-8">

<h1 class="text-2xl font-bold mb-6">
Add New Student
</h1>


{% if error %}

<div class="bg-red-100 text-red-700 p-4 rounded-lg mb-5">
{{ error }}
</div>

{% endif %}


<form method="post" action="/students/add">

<div class="grid md:grid-cols-2 gap-5">


<div>

<label class="block mb-2 font-medium">
Student ID
</label>

<input
    type="text"
    name="student_id"
    required
    class="w-full border rounded-lg px-4 py-3"
    placeholder="STU001"
>

</div>


<div>

<label class="block mb-2 font-medium">
Student Name
</label>

<input
    type="text"
    name="name"
    required
    class="w-full border rounded-lg px-4 py-3"
    placeholder="Student name"
>

</div>


<div>

<label class="block mb-2 font-medium">
    <label for="gender" class="block mb-2 font-medium">
Gender
</label>

<select
    id="gender"
    name="gender"
    class="w-full border rounded-lg px-4 py-3"
>

<option value="Male">
Male
</option>

<option value="Female">
Female
</option>

</select>

</div>


<div>

<label class="block mb-2 font-medium">
Phone
</label>

<input
    type="text"
    name="phone"
    class="w-full border rounded-lg px-4 py-3"
    placeholder="012 345 678"
>

</div>


<div class="md:col-span-2">

<label class="block mb-2 font-medium">
Class
</label>

<input
    type="text"
    name="class_name"
    class="w-full border rounded-lg px-4 py-3"
    placeholder="IT Year 3"
>

</div>

</div>


<div class="flex justify-end gap-3 mt-8">

<a
    href="/students"
    class="px-5 py-3 bg-gray-200 rounded-lg"
>
    Cancel
</a>

<button
    type="submit"
    class="px-5 py-3 bg-indigo-600 text-white rounded-lg"
>
    Save Student
</button>

</div>

</form>

</div>

</div>

{% endblock %}
